# Daily: follow upstream seedds/nxnative. The fork is a fresh repository (no shared git
# history), so GitHub's own "Sync fork" does not apply; scripts/sync_upstream.py is the
# sync instead — upstream's tree, the fork's features re-applied, then verification
# (Python 3.9 parse, bash -n, the archive reader test, a macOS host build). Success is
# committed and pushed; a failure opens an issue and pushes nothing.
name: Sync upstream

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 5:30 Beijing
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: macos-latest   # the host build needs clang + macOS headers
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/seedds/nxnative.git
          git fetch upstream main

      - name: Sync (and verify)
        id: sync
        run: |
          LAST=$(cat .upstream-ref 2>/dev/null || true)
          NEW=$(git rev-parse upstream/main)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$LAST" = "$NEW" ]; then echo "Already at $NEW"; exit 0; fi
          python3 scripts/sync_upstream.py --old "${LAST:-$NEW}" --new "$NEW" 2>&1 | tee sync.log
          exit ${PIPESTATUS[0]}

      - name: Commit and push
        if: success() && steps.sync.outcome == 'success'
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git rev-parse upstream/main > .upstream-ref
          git add -A
          git diff --cached --quiet || git commit -m "Sync upstream $(git rev-parse --short upstream/main)"
          git push

      - name: Open an issue when the sync fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW=$(git rev-parse upstream/main 2>/dev/null || echo '?')
          tail -40 sync.log > sync-tail.log 2>/dev/null || echo "see the workflow log" > sync-tail.log
          gh issue create --title "Upstream sync failed at ${NEW:0:7}" \
            --body "The scheduled sync could not re-apply the fork's patches or verify the build. The tree is untouched on main; run scripts/sync_upstream.py locally to see the full picture.

          \`\`\`
          $(tail -40 sync.log 2>/dev/null)
          \`\`\`" || echo "issue creation failed; the log is in sync.log"
